# OPTIONAL Render Blueprint.
#
# You do not need this file if you configure the service by hand in the
# Render dashboard (see DEPLOYMENT_RENDER.md). It is here so the setup is
# reproducible and so DATABASE_URL can never be forgotten - the
# fromDatabase block below wires it in automatically, which is precisely
# the step whose omission caused the original data loss.

databases:
  - name: library-db
    databaseName: library_db
    user: library_user
    plan: free          # NOTE: free Postgres is deleted after 30 days.
                        # Change to "basic-256mb" (or higher) for anything
                        # you cannot afford to lose.

services:
  - type: web
    name: library-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Injected by Render from the database above. This is the single
      # setting that makes the data persistent.
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString

      # Generated once by Render and then held stable. Changing it later
      # invalidates every issued login token.
      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"

      # Set this to your actual Netlify URL, no trailing slash.
      - key: CORS_ORIGINS
        sync: false

      # Only used to seed the very first admin when the users table is
      # empty. Set a real password here rather than leaving the default.
      - key: DEFAULT_ADMIN_USERNAME
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
